/var/log/hostsfile-dyndns-updater/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    # Both parts reopen the log by themselves; the file must always exist for
    # fail2ban, and the unprivileged API writes it through its group.
    create 0660 root hostsfile-dyndns
}
