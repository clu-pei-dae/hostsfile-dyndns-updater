# fail2ban filter for hostsfile-dyndns-updater.
# Matches every rejected API request (bad credentials, bad addresses, wrong
# host, bad method) in /var/log/hostsfile-dyndns-updater/requests.log, e.g.
#   2026-09-30T10:16:40+0200 FAIL status=401 result=badauth client=198.51.100.4 user=-
# Test: fail2ban-regex /var/log/hostsfile-dyndns-updater/requests.log hostsfile-dyndns-updater

[Definition]
failregex = ^\s*FAIL status=\d+ result=\S+ client=<ADDR> user=\S+
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S%%z
