# hostsfile-dyndns-updater configuration.
# After editing run: hostsfile-dyndns-updater check-config && systemctl restart hostsfile-dyndns-updater

[server]
# Unix socket nginx proxies to. Must match the nginx site configuration.
socket = /run/hostsfile-dyndns-updater/api.sock
# Group allowed to connect to the socket (the nginx worker group).
socket_group = www-data
# File that is modified.
hosts_file = /etc/hosts
# Accept RFC 1918 / ULA addresses as update target (off: only public addresses).
allow_private_addresses = no
# Require the announced address to equal the connecting address (same IP family).
# Turn on only if the FritzBox talks to this server over its own public address.
require_source_match = no
# Also accept credentials as ?username=&password= (they may end up in logs of
# proxies on the way and in the nginx error log). Basic authentication is
# preferred and always accepted.
allow_query_credentials = no

# One section per hostname. Create the hash with: hostsfile-dyndns-updater hash-password
#
# [host home]
# hostname = home.example.org
# username = fritzbox
# password_hash = pbkdf2_sha256$600000$...$...
