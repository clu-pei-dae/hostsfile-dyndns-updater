# hostsfile-dyndns-updater configuration.
# After editing run: hostsfile-dyndns-updater check-config && systemctl restart hostsfile-dyndns-updater
#
# The API service runs as user hostsfile-dyndns and reads this file through its
# group (keep the file root:hostsfile-dyndns 0640). Changes to hosts_file are
# written by a root helper that systemd starts per change.

[server]
# Unix socket nginx proxies to, and the group allowed to connect. Under systemd
# both are set in hostsfile-dyndns-updater.socket and these two are ignored.
socket = /run/hostsfile-dyndns-updater/api.sock
socket_group = www-data
# Socket of the root helper that writes hosts_file (hostsfile-dyndns-updater-apply.socket).
# Empty: the API process writes hosts_file itself, which then has to run as root.
apply_socket = /run/hostsfile-dyndns-updater/apply.sock
# File that is modified. The helper may only write /etc/hosts; for another file
# add it to ReadWritePaths= of hostsfile-dyndns-updater-apply@.service.
hosts_file = /etc/hosts
# Accept RFC 1918 / ULA addresses as update target (off: only public addresses).
allow_private_addresses = no
# Require the announced address to equal the connecting address (same IP family).
# Turn on only if the FritzBox talks to this server over its own public address.
require_source_match = no
# Also accept credentials as ?username=&password= (they may end up in logs of
# proxies on the way and in the nginx error log). Basic authentication is
# preferred and always accepted.
allow_query_credentials = no
# Request log, written by the API service and the root helper (read by the
# fail2ban jail, rotated by logrotate). Both may only write below
# /var/log/hostsfile-dyndns-updater/. Empty: log to the journal.
log_file = /var/log/hostsfile-dyndns-updater/requests.log
# all     - every request with its result (good / nochg / error)
# changes - only requests that changed an address
# Rejected requests (e.g. wrong password), errors and the helper's lines about
# writing the hosts file are logged with both settings.
log_level = changes

# One section per hostname. Create the hash with: hostsfile-dyndns-updater hash-password
#
# [host home]
# hostname = home.example.org
# username = fritzbox
# password_hash = pbkdf2_sha256$600000$...$...
