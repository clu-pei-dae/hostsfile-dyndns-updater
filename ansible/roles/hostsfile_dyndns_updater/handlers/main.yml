---
- name: Restart hostsfile-dyndns-updater
  ansible.builtin.systemd:
    name: hostsfile-dyndns-updater
    state: restarted

- name: Restart hostsfile-dyndns-updater sockets
  # Restarting the sockets stops the service bound to them; start it again.
  ansible.builtin.shell: |
    systemctl daemon-reload
    systemctl restart hostsfile-dyndns-updater.socket hostsfile-dyndns-updater-apply.socket
    systemctl restart hostsfile-dyndns-updater.service
  changed_when: true

- name: Reload fail2ban
  # Only if fail2ban runs; a failing configuration test aborts the play.
  ansible.builtin.shell: |
    if systemctl is-active --quiet fail2ban; then
      fail2ban-client -t && fail2ban-client reload
    fi
  changed_when: true

- name: Reload nginx
  ansible.builtin.shell: nginx -t && systemctl reload nginx
  changed_when: true
