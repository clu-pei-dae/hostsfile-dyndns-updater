---
# How the package is installed:
#   github - download the .deb from a GitHub release on the target host (default)
#   file   - copy a .deb from the Ansible controller (hostsfile_dyndns_updater_deb_src)
#   apt    - install "hostsfile-dyndns-updater" from a configured apt repository
hostsfile_dyndns_updater_install_method: github

# github: repository and release ("latest" or a tag such as "v0.2.0"). The download is
# verified against the release's SHA256SUMS. With "latest", each run picks up new releases.
hostsfile_dyndns_updater_github_repo: clu-pei-dae/hostsfile-dyndns-updater
hostsfile_dyndns_updater_github_release: latest

# file: path of a .deb on the controller (e.g. built with packaging/build-deb.sh).
hostsfile_dyndns_updater_deb_src: ""

# nginx
hostsfile_dyndns_updater_server_name: dyndns.example.org
hostsfile_dyndns_updater_listen_port: 443
# Also listen on IPv6. Disable on hosts without IPv6, nginx would not start.
hostsfile_dyndns_updater_listen_ipv6: true
# Certificate the FritzBox trusts (e.g. Let's Encrypt). Must already exist on the host.
hostsfile_dyndns_updater_tls_certificate: /etc/ssl/certs/ssl-cert-snakeoil.pem
hostsfile_dyndns_updater_tls_certificate_key: /etc/ssl/private/ssl-cert-snakeoil.key
# Optional source restriction, e.g. ["203.0.113.0/24"]. Empty = allow all.
hostsfile_dyndns_updater_nginx_allow: []
hostsfile_dyndns_updater_rate_limit: 6r/m
hostsfile_dyndns_updater_rate_burst: 5

# backend ([server] section of config.ini)
hostsfile_dyndns_updater_socket_group: www-data
hostsfile_dyndns_updater_hosts_file: /etc/hosts
hostsfile_dyndns_updater_allow_private_addresses: false
hostsfile_dyndns_updater_require_source_match: false
hostsfile_dyndns_updater_allow_query_credentials: false
# Request log /var/log/hostsfile-dyndns-updater/requests.log:
#   changes - only requests that changed an address (plus all rejected requests)
#   all     - every request with its result (plus all rejected requests)
hostsfile_dyndns_updater_log_level: changes

# fail2ban jail on the request log. Only applied if fail2ban is installed on the target.
hostsfile_dyndns_updater_fail2ban_enabled: true
hostsfile_dyndns_updater_fail2ban_maxretry: 5
hostsfile_dyndns_updater_fail2ban_findtime: 10m
hostsfile_dyndns_updater_fail2ban_bantime: 1h
# Never banned, e.g. the FritzBox' address or your ISP's range. Localhost is always added.
hostsfile_dyndns_updater_fail2ban_ignoreip: []

# Hostnames to maintain. Required. Create hashes with
#   hostsfile-dyndns-updater hash-password
# and keep them in Ansible Vault.
# hostsfile_dyndns_updater_hosts:
#   - name: home
#     hostname: home.example.org
#     username: fritzbox
#     password_hash: "pbkdf2_sha256$600000$..."
hostsfile_dyndns_updater_hosts: []
