---
- name: Validate role variables
  ansible.builtin.assert:
    that:
      - hostsfile_dyndns_updater_hosts | length > 0
      - hostsfile_dyndns_updater_hosts | map(attribute='password_hash') | select('match', '^pbkdf2_sha256[$]') | list | length == hostsfile_dyndns_updater_hosts | length
    fail_msg: hostsfile_dyndns_updater_hosts must list at least one host and every entry needs a pbkdf2_sha256 password_hash

- name: Validate log level
  ansible.builtin.assert:
    that:
      - hostsfile_dyndns_updater_log_level in ['all', 'changes']
    fail_msg: hostsfile_dyndns_updater_log_level must be "all" or "changes"

- name: Validate install method
  ansible.builtin.assert:
    that:
      - hostsfile_dyndns_updater_install_method in ['github', 'file', 'apt']
      - hostsfile_dyndns_updater_install_method != 'file' or hostsfile_dyndns_updater_deb_src | length > 0
    fail_msg: install_method must be github, file or apt; "file" needs hostsfile_dyndns_updater_deb_src

- name: Set GitHub release download URL
  ansible.builtin.set_fact:
    hostsfile_dyndns_updater_release_url: >-
      https://github.com/{{ hostsfile_dyndns_updater_github_repo }}/releases/{{
      'latest/download' if hostsfile_dyndns_updater_github_release == 'latest'
      else 'download/' ~ hostsfile_dyndns_updater_github_release }}
  when: hostsfile_dyndns_updater_install_method == 'github'

- name: Download package from GitHub release
  ansible.builtin.get_url:
    url: "{{ hostsfile_dyndns_updater_release_url }}/hostsfile-dyndns-updater_all.deb"
    checksum: "sha256:{{ hostsfile_dyndns_updater_release_url }}/SHA256SUMS"
    dest: /var/tmp/hostsfile-dyndns-updater_all.deb
    mode: "0644"
  when: hostsfile_dyndns_updater_install_method == 'github'

- name: Copy package to target
  ansible.builtin.copy:
    src: "{{ hostsfile_dyndns_updater_deb_src }}"
    dest: /var/tmp/hostsfile-dyndns-updater_all.deb
    mode: "0644"
  when: hostsfile_dyndns_updater_install_method == 'file'

- name: Install package from file
  ansible.builtin.apt:
    deb: /var/tmp/hostsfile-dyndns-updater_all.deb
  when: hostsfile_dyndns_updater_install_method in ['github', 'file']
  notify: Restart hostsfile-dyndns-updater

- name: Install package from repository
  ansible.builtin.apt:
    name: hostsfile-dyndns-updater
    state: latest
    update_cache: true
    cache_valid_time: 3600
  when: hostsfile_dyndns_updater_install_method == 'apt'
  notify: Restart hostsfile-dyndns-updater

- name: Configure backend
  ansible.builtin.template:
    src: config.ini.j2
    dest: /etc/hostsfile-dyndns-updater/config.ini
    owner: root
    # The unprivileged API service reads it through its group.
    group: hostsfile-dyndns
    mode: "0640"
    validate: /usr/bin/hostsfile-dyndns-updater check-config -c %s
  notify: Restart hostsfile-dyndns-updater

- name: Create systemd drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - hostsfile-dyndns-updater.socket
    - hostsfile-dyndns-updater-apply@.service

- name: Set the group nginx connects with (socket unit)
  ansible.builtin.copy:
    dest: /etc/systemd/system/hostsfile-dyndns-updater.socket.d/ansible.conf
    content: |
      # {{ ansible_managed }}
      [Socket]
      SocketGroup={{ hostsfile_dyndns_updater_socket_group }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart hostsfile-dyndns-updater sockets

- name: Let the root helper write the configured hosts file
  ansible.builtin.copy:
    dest: /etc/systemd/system/hostsfile-dyndns-updater-apply@.service.d/ansible.conf
    content: |
      # {{ ansible_managed }}
      [Service]
      ReadWritePaths={{ hostsfile_dyndns_updater_hosts_file }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart hostsfile-dyndns-updater sockets

- name: Configure nginx site
  ansible.builtin.template:
    src: nginx-site.conf.j2
    dest: /etc/nginx/sites-available/hostsfile-dyndns-updater
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable nginx site
  ansible.builtin.file:
    src: ../sites-available/hostsfile-dyndns-updater
    dest: /etc/nginx/sites-enabled/hostsfile-dyndns-updater
    state: link
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Enable and start sockets and backend
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - hostsfile-dyndns-updater.socket
    - hostsfile-dyndns-updater-apply.socket
    - hostsfile-dyndns-updater.service

- name: Check whether fail2ban is installed
  ansible.builtin.stat:
    path: /etc/fail2ban/jail.d
  register: hostsfile_dyndns_updater_fail2ban_dir

- name: Configure fail2ban jail
  ansible.builtin.template:
    src: fail2ban-jail.conf.j2
    dest: /etc/fail2ban/jail.d/hostsfile-dyndns-updater.conf
    owner: root
    group: root
    mode: "0644"
  when: hostsfile_dyndns_updater_fail2ban_dir.stat.exists
  notify: Reload fail2ban
